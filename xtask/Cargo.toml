[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Default is the host lane: `arch-check` and `index` build with no CUDA toolkit
# and no driver library (document 07). `cuda` adds the device commands and is
# what `cargo xtask-cuda` turns on.
default = []
cuda = [
    "dep:moxie-cuda",
    "dep:moxie-kernels",
    "dep:moxie-executor",
    "dep:moxie-graph",
    "dep:moxie-plan",
    "dep:moxie-interp",
    "moxie-cuda/driver",
    "moxie-kernels/fatbin",
    "moxie-executor/driver",
]

[dependencies]
moxie-types.workspace = true
moxie-format.workspace = true
moxie-memory.workspace = true
moxie-host.workspace = true
moxie-cuda = { workspace = true, optional = true }
moxie-kernels = { workspace = true, optional = true }
moxie-executor = { workspace = true, optional = true }
moxie-graph = { workspace = true, optional = true }
moxie-plan = { workspace = true, optional = true }
moxie-interp = { workspace = true, optional = true }
toml = "0.9"
# Parsing model-crate source structurally rather than by text search. See
# ADR 0004. All three are already in the lock graph via `toml`'s `serde_derive`,
# so this adds no new package to the build.
syn = { version = "=3.0.3", default-features = false, features = ["full", "parsing", "printing", "visit"] }
quote = "1"
proc-macro2 = "1"

[lints]
workspace = true
