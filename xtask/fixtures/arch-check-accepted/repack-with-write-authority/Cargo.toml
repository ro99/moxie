[package]
name = "moxie-repack"
version = "0.0.0"
edition = "2024"

# The one program ADR 0022 gives canonical write authority to. It may name the
# writer, the reader, the codec, the ledger and the host sensor -- and this
# fixture is here because a checker with only negative fixtures is satisfied by
# rejecting everything.
[dependencies]
moxie-types = { path = "../../../../crates/moxie-types" }
moxie-format = { path = "../../../../crates/moxie-format" }
moxie-storage = { path = "../../../../crates/moxie-storage" }
moxie-storage-write = { path = "../../../../crates/moxie-storage-write" }
moxie-memory = { path = "../../../../crates/moxie-memory" }
moxie-host = { path = "../../../../crates/moxie-host" }
