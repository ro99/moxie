[package]
name = "moxie-engine"
version = "0.0.0"
edition = "2024"
build = "build.rs"

# A build script that can write a canonical artifact writes it at build time,
# on a developer's machine, with no command and no budget. A build dependency
# is production, not tooling.
[build-dependencies]
moxie-storage-write = { path = "../../../../crates/moxie-storage-write" }

[package.metadata.moxie-arch-check]
expect-rule = "canonical write authority outside the offline repacker"
