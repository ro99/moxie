[package]
name = "moxie-engine"
version = "0.0.0"
edition = "2024"

# The engine is a generation composition root. Canonical write authority
# belongs to the offline repacker (ADR 0022): a process that generates tokens
# must not be able to publish or overwrite a checkpoint. This fixture must be
# rejected.
[dependencies]
moxie-storage-write = { path = "../../../../crates/moxie-storage-write" }

[package.metadata.moxie-arch-check]
expect-rule = "canonical write authority outside the offline repacker"
