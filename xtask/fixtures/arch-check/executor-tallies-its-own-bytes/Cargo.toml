[package]
name = "moxie-executor"
version = "0.0.0"
edition = "2024"

# Task 0023 put a **trace** in the executor: it reads the residency authority's
# per-scope byte flow, the ledger's charges and the plan's prediction, and checks
# that the three describe the same bytes. Reading them is the whole point.
# Keeping its own copy is the failure the trace exists to detect, one layer up:
# a crate that counts bytes itself will eventually disagree with the authority,
# and a reconciliation between an owner and its own shadow proves nothing. This
# fixture must be rejected.
[dependencies]
moxie-types = { path = "../../../../crates/moxie-types" }
moxie-memory = { path = "../../../../crates/moxie-memory" }

[package.metadata.moxie-arch-check]
expect-rule = "a second weight-residency owner"
