[package]
name = "moxie-engine"
version = "0.0.0"
edition = "2024"

# Optional is not absent: a feature that enables it puts the writer in the
# build. "It is off by default" is a claim about configuration, and Cargo
# unifies features across a workspace build anyway -- which is the reason
# ADR 0022 made the writer a crate rather than a feature.
[dependencies]
moxie-storage-write = { path = "../../../../crates/moxie-storage-write", optional = true }

[features]
publish = ["dep:moxie-storage-write"]

[package.metadata.moxie-arch-check]
expect-rule = "canonical write authority outside the offline repacker"
