[package]
name = "moxie-format"
version = "0.0.0"
edition = "2024"

# Must be rejected: `#[path]` resolves against the declaring file's
# directory, not the module base -- `#[path = "io.rs"]` in `src/outer.rs`
# loads `src/io.rs`, never `src/outer/io.rs` (verified against rustc).

[package.metadata.moxie-arch-check]
expect-rule = "format touches the filesystem"
