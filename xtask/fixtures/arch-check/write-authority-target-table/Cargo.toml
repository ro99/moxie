[package]
name = "moxie-engine"
version = "0.0.0"
edition = "2024"

# A real dependency, on the platform this repository targets, written where a
# checker that reads only the two top-level tables would not look.
[target.'cfg(unix)'.dependencies]
moxie-storage-write = { path = "../../../../crates/moxie-storage-write" }

[package.metadata.moxie-arch-check]
expect-rule = "canonical write authority outside the offline repacker"
