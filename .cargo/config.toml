# CUDA's default device ordering is FASTEST_FIRST, which reorders devices by an
# opaque heuristic and can differ between driver versions and between machines.
# PCI_BUS_ID makes CUDA ordinals match `nvidia-smi` indices, so a device ordinal
# in a plan, manifest or bug report means the same card every time.
#
# This applies only to processes cargo launches (build scripts, `cargo run`,
# `cargo test`, `cargo xtask`). A binary started outside cargo needs the variable
# set in its own environment. Ordinals are for humans and diagnostics; anything
# recorded as evidence identifies a GPU by UUID, per document 07.
[env]
CUDA_DEVICE_ORDER = "PCI_BUS_ID"
