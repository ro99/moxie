# CUDA's default device ordering is FASTEST_FIRST, which reorders devices by an
# opaque heuristic and can differ between driver versions and between machines.
# PCI_BUS_ID makes CUDA ordinals match `nvidia-smi` indices, so a device ordinal
# in a plan, manifest or bug report means the same card every time.
#
# `force = true` is load-bearing. Without it, cargo's `[env]` only supplies a
# value when the variable is *unset*, so an inherited FASTEST_FIRST from the
# shell would win silently and every ordinal in this repo would mean a different
# card. That has happened on this machine before.
#
# This covers processes cargo launches (build scripts, `cargo run`, `cargo test`,
# `cargo xtask`). A binary started outside cargo needs the variable set in its
# own environment. Ordinals are for humans and diagnostics; anything recorded as
# evidence identifies a GPU by UUID, per document 07.
[env]
CUDA_DEVICE_ORDER = { value = "PCI_BUS_ID", force = true }

# Two aliases, because the two lanes are genuinely different builds and must not
# be confused for each other (document 07).
#
#   cargo xtask <cmd>        host lane: no nvcc, no libcuda, no GPU.
#   cargo xtask-cuda <cmd>   device lane: compiles fatbins, links the driver.
#
# `cargo xtask-cuda arch-check` would also work, but running the host checks
# through the device build makes the host lane's independence untested. Keep
# them apart. A fresh clone can execute both, which is the point: the commands
# documented in README/task records are the commands that exist.
[alias]
xtask = "run --quiet -p xtask --"
xtask-cuda = "run --quiet -p xtask --features cuda --"
