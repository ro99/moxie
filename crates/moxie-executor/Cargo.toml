[package]
name = "moxie-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Off by default so the host lane never links libcuda. `driver` binds leases
# to real completion events; without it only the pure retirement machine and
# the manual test double compile.
default = ["numa"]
driver = ["moxie-cuda/driver", "moxie-kernels/fatbin"]
# The production binding connects the state authority to its device runs.
# Raw page mutation remains available only to the qualification harness.
paged-attention-binding = ["driver", "dep:moxie-state"]
paged-attention-test-hooks = ["paged-attention-binding"]
# NUMA-aware host placement (task 0021, roadmap M2 item 3). One audited glibc
# FFI block for thread affinity; on by default because the benchmark machine has
# two nodes and the GPUs are split across them, and `HostPlacementControl`'s
# `required` is what errors when this is absent.
numa = []

[dependencies]
moxie-types.workspace = true
moxie-graph.workspace = true
moxie-memory.workspace = true
# Task 0020: the residency driver performs the authority's read orders through
# the one crate that owns the filesystem. `moxie-memory` may not open a file and
# `moxie-storage` may not know what a cache is, so the edge belongs here, where
# the crate that already "schedules actual effects" performs them.
moxie-storage.workspace = true
# Task 0028: the canonical affine descriptor -- width, group rule, zero-point
# mode and scale dtype -- is `moxie-format`'s vocabulary, and the quantized
# launch is derived from it. Restating those four things as a second set of
# enums here is how one format becomes two.
moxie-format.workspace = true
moxie-cuda.workspace = true
moxie-plan.workspace = true
moxie-kernels.workspace = true
moxie-state = { workspace = true, optional = true }

[dev-dependencies]
moxie-oracles.workspace = true
# Task 0020's real-artifact test builds its demand set the way a routed step
# does, through the engine's route-to-chunk arithmetic. A dev dependency only:
# the executor's production code names no engine type, and a fixture proves the
# production edge is refused.
moxie-engine.workspace = true
# Task 0021: the grouped run's answer is checked against task 0019's accepted
# oracle, and its NUMA placement is *measured* through the one crate ADR 0006
# lets read `/proc`. Both are test-only; production code here names neither.
moxie-host.workspace = true
# Task 0022: the second consumer's *declared geometry* comes from the model
# definition rather than from literals repeated in a test. Document 02 allows
# exactly two places to import a concrete model -- the composition root and
# integration tests -- and `arch-check` excludes dev-dependencies in every
# table for that reason. A fixture proves the production edge is refused.
moxie-models.workspace = true
# Task 0028 acceptance 5: the real-module case publishes one module of one
# inventoried checkpoint into a private temporary directory and then executes
# it, so the two halves of M3 meet in one test. A dev dependency only -- the
# executor's production code names no converter, and nothing here may write
# under a checkpoint root.
moxie-repack.workspace = true
# The reduced Gemma composition root and host interpreter are test-only
# consumers of this device binding; production remains model-independent.
moxie-cli = { path = "../moxie-cli" }
moxie-interp.workspace = true

[lints]
workspace = true
