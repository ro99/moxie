# Canonical manifest v1 example (task 0005).
#
# Human-readable, diffable, reviewable without running the engine -- which is
# the point of a text manifest beside opaque chunks (ADR 0005). The payload
# artifact is generated by test helpers into a temporary directory; no binary
# blob enters git, and the generator is itself the demonstration that the
# format can be written as well as read.
#
# Document 07 permits "small redistributable fixtures". This file parses under
# `moxie_format::manifest::parse`; the per-rule malformed manifests live as
# strings in the tests, one per rule.

schema_version = 1
required_features = []
endianness = "little"

[source]
model = "example-tiny"
revision = "r1"
license = "apache-2.0"
[[source.files]]
path = "original.safetensors"
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[tokenizer]
name = "example-tok"
version = "1"
digest = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[template]
name = "example-chat"
version = "1"
digest = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[architecture]
name = "example"
version = "1"
[architecture.metadata]
hidden = 32
layers = 2
# Opaque by construction: moxie-format hashes this tree into artifact identity
# and never reads a field of it. Interpreting it is a moxie-models-* job.

[provenance]
scale_convention = "affine-v1"
quantizer = "none"
calibration = "none"

# Two BF16 tensors in two chunks. 4x4 BF16 = 32 bytes each.
[[tensors]]
role = "block0.attn.q"
shape = [4, 4]
precision = "bf16-v1"
chunk = "chunk0.bin"
offset = 0
length = 32
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
alignment = 16
logical_order = 0

[[tensors]]
role = "block0.attn.k"
shape = [4, 4]
precision = "bf16-v1"
chunk = "chunk1.bin"
offset = 0
length = 32
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
alignment = 16
logical_order = 1

# An affine tensor would be described here and refused at read time with an
# error naming M3. It is omitted from this minimal fixture so the file stays
# a pure BF16 round-trip example; affine descriptor cases live in the tests.

# Tensors the source had and this artifact deliberately does not, each with a
# reason. An empty list is a claim, so it is written explicitly.
[[excluded]]
role = "lm_head"
reason = "tied to the embedding in this example artifact; no separate payload"

[completeness]
status = "complete"
missing = []
