[package]
name = "moxie-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Off by default: compiling the fatbins needs the pinned CUDA toolkit, and
# document 07 requires the host lane to run without one. Enabling it runs nvcc,
# verifies its version against the pin and embeds the images.
default = []
fatbin = []

[dependencies]
moxie-types.workspace = true

[dev-dependencies]
# The BF16 rounding contract lives in `moxie-format`, which sits beside this
# crate rather than below it, so `cpu_expert::bf16_round` is a reimplementation.
# A dev dependency is what makes "demonstrably the same function" a test rather
# than a comment; production code here still names `moxie-types` alone.
moxie-format.workspace = true
# Task 0019's accepted FP64 reference. The host expert kernel's declared gate is
# **bitwise** equality with it, so the oracle has to be in the test binary; it is
# not reachable from production code here.
moxie-oracles.workspace = true
moxie-graph.workspace = true

[lints]
workspace = true
