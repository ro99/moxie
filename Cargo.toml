[workspace]
resolver = "3"
members = [
    "crates/moxie-types",
    "crates/moxie-graph",
    "crates/moxie-interp",
    "crates/moxie-model-api",
    "crates/moxie-format",
    "crates/moxie-oracles",
    "crates/moxie-state",
    "crates/moxie-sampling",
    "crates/moxie-memory",
    "crates/moxie-host",
    "crates/moxie-storage",
    "crates/moxie-cuda",
    "crates/moxie-kernels",
    "crates/moxie-plan",
    "crates/moxie-executor",
    "crates/moxie-engine",
    "crates/moxie-models",
    "crates/moxie-cli",
    "crates/moxie-repack",
    "xtask",
]
exclude = ["xtask/fixtures"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
moxie-types = { path = "crates/moxie-types" }
moxie-graph = { path = "crates/moxie-graph" }
moxie-interp = { path = "crates/moxie-interp" }
moxie-model-api = { path = "crates/moxie-model-api" }
moxie-format = { path = "crates/moxie-format" }
moxie-oracles = { path = "crates/moxie-oracles" }
moxie-state = { path = "crates/moxie-state" }
moxie-sampling = { path = "crates/moxie-sampling" }
moxie-memory = { path = "crates/moxie-memory" }
moxie-host = { path = "crates/moxie-host" }
moxie-storage = { path = "crates/moxie-storage" }
moxie-repack = { path = "crates/moxie-repack" }
moxie-cuda = { path = "crates/moxie-cuda" }
moxie-kernels = { path = "crates/moxie-kernels" }
moxie-plan = { path = "crates/moxie-plan" }
moxie-executor = { path = "crates/moxie-executor" }
moxie-engine = { path = "crates/moxie-engine" }
moxie-models = { path = "crates/moxie-models" }

[profile.release]
debug = 1

# The codec's inner loops -- SHA-256, nibble packing, scale decoding -- run over
# every byte of every artifact a test touches, and an unoptimized build runs
# them at roughly 12 MB/s. That is what made task 0025's real-artifact lane
# spend seven and a half minutes hashing one 5.37 GB shard. Optimizing this one
# package in dev builds changes nothing about what the code does or which tests
# run; it changes how long a gate takes to tell you the answer. Debug
# information is kept, so a backtrace through it still names lines.
[profile.dev.package.moxie-format]
opt-level = 2

# The host reference every GPU test compares against: the interpreter and the
# oracles it dispatches to. Unoptimized, a 512x4096x4096 reference linear stalled
# task 0096's gate. Rust never reassociates floating point at any opt-level (no
# fast-math), so the reference computes the same bits; only the wait changes.
[profile.dev.package.moxie-interp]
opt-level = 2

[profile.dev.package.moxie-oracles]
opt-level = 2

# Third-party dependencies in dev builds. `"*"` covers dependencies only, never
# a workspace crate, so nothing in this repository is compiled differently by
# it. The manifest cap fixture parses a document with 1,048,577 tables in it to
# prove the cap is checked before validation, and an unoptimized TOML parser
# spends a minute and a half on that one test.
[profile.dev.package."*"]
opt-level = 2

# Applied to every crate via `[lints] workspace = true`. Document 02 requires the
# FFI boundary to be audited, not merely compiled: unsafe code must be justified
# in writing at each site.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
